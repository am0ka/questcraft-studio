name: CI & Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  ts-tests:
    name: TypeScript Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint & Typecheck
        run: pnpm lint

      - name: Run Core Engine Tests with Coverage
        run: pnpm test:coverage

      - name: Build Next.js Application
        run: pnpm build

  deploy:
    name: Zero-Downtime Deploy
    needs: [ts-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host tunnel-host
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

      - name: Execute Zero-Downtime Deployment
        run: |
          ssh tunnel-host "bash -s" << 'EOF'
            set -euo pipefail

            echo "🚀 Starting Deployment in ${{ secrets.DEPLOY_PATH }}..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Pre-building images in background..."
            docker compose build

            echo "🔄 Gracefully updating Web (Next.js Application)..."
            docker compose up -d --remove-orphans --wait web

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Zero-Downtime deploy complete!"
          EOF