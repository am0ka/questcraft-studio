[project]
name = "api"
version = "0.1.0"
description = "FastAPI Graph Engine & Asset Compiler"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]