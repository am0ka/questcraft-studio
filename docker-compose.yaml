services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: questcraft_api
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questcraft-api.rule=Host(`projects.sarsen.dev`) && PathPrefix(`/questcraft/api`)"
      - "traefik.http.routers.questcraft-api.entrypoints=websecure"
      - "traefik.http.routers.questcraft-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.questcraft-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.questcraft-api-strip.stripprefix.prefixes=/questcraft"
      - "traefik.http.routers.questcraft-api.middlewares=questcraft-api-strip"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: questcraft_web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/questcraft
      - NEXT_PUBLIC_API_URL=https://projects.sarsen.dev/questcraft/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questcraft-web.rule=Host(`projects.sarsen.dev`) && PathPrefix(`/questcraft`)"
      - "traefik.http.routers.questcraft-web.entrypoints=websecure"
      - "traefik.http.routers.questcraft-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.questcraft-web.loadbalancer.server.port=3000"
